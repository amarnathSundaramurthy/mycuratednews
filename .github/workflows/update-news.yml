name: Update news

on:
  schedule:
    - cron: "0 2,13 * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect and build news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m newsbot.main

      - name: Save results
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "News update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
