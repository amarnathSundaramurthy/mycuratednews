<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Highlights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf7f0;
    --card: #ffffff;
    --text: #2b2a28;
    --muted: #7b756c;
    --line: #eee6da;
    --accent: #ff7a59;
    --chip: #f3ece1;
    --shadow: 0 1px 2px rgba(60, 45, 20, .05), 0 6px 18px rgba(60, 45, 20, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18;
      --card: #252321;
      --text: #f1ece4;
      --muted: #a39b8f;
      --line: #34312d;
      --accent: #ff9475;
      --chip: #2f2c28;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }

  header { padding: 28px 0 8px; }
  h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  h1 span { color: var(--accent); }
  .date { margin-top: 2px; color: var(--muted); font-size: 15px; }

  .tabs {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 0; margin: 8px 0 4px;
    background: var(--bg);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 0; cursor: pointer;
    padding: 8px 14px; border-radius: 999px;
    background: var(--chip); color: var(--text);
    font: inherit; font-size: 14px; font-weight: 700;
    transition: background .15s, color .15s;
  }
  .tab .n { opacity: .55; font-weight: 600; margin-left: 4px; }
  .tab[aria-selected="true"] { background: var(--accent); color: #fff; }
  .tab[aria-selected="true"] .n { opacity: .85; }

  .list { display: grid; gap: 12px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 16px 18px;
    box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
          font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .tag { font-weight: 700; }
  .hot { color: var(--accent); font-weight: 700; }
  .card h2 { margin: 0 0 6px; font-size: 18px; line-height: 1.35; font-weight: 800; }
  .card h2 a { color: inherit; text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
  .card p { margin: 0; color: var(--text); opacity: .88; }
  .tip { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: var(--chip); font-size: 15px; }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .sources a {
    font-size: 13px; color: var(--muted); text-decoration: none;
    padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line);
  }
  .sources a:hover { color: var(--accent); border-color: var(--accent); }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  footer { margin-top: 28px; text-align: center; color: var(--muted); font-size: 13px; }
  @media (max-width: 480px) {
    h1 { font-size: 26px; }
    .card { padding: 14px 15px; }
    .card h2 { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>News <span>Highlights</span></h1>
    <div class="date" id="date">Loading…</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main class="list" id="list"></main>
  <footer id="footer"></footer>
</div>

<script>
  // Tabs shown in this order. A tab only appears if it has stories.
  const TABS = [
    { id: "all",   label: "All",             emoji: "✨" },
    { id: "KA",    label: "Karnataka",       emoji: "📍" },
    { id: "TN",    label: "Tamil Nadu",      emoji: "🛕" },
    { id: "IN",    label: "India",           emoji: "🇮🇳" },
    { id: "biz",   label: "Tech & Business", emoji: "💼" },
    { id: "ai",    label: "AI",              emoji: "🤖" },
    { id: "tips",  label: "AI Tips",         emoji: "💡" },
    { id: "WORLD", label: "World",           emoji: "🌍" },
  ];
  // Map the data's tab codes to page tabs (TG, AP, KL big stories go under India)
  const GROUP = { KA: "KA", TN: "TN", IN: "IN", TG: "IN", AP: "IN", KL: "IN",
                  biz: "biz", ai_buzz: "ai", ai_hacks: "tips", WORLD: "WORLD" };

  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function ago(sec) {
    const m = Math.max(1, Math.round((Date.now() / 1000 - sec) / 60));
    if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h} hr ago`;
    const d = Math.round(h / 24);
    return d === 1 ? "yesterday" : `${d} days ago`;
  }

  function niceDate(sec) {
    const d = new Date(sec * 1000);
    const day = d.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    const time = d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
    return `${day} · updated ${time}`;
  }

  function card(s) {
    const tab = TABS.find((t) => t.id === GROUP[s.tab]) || TABS[0];
    const first = (s.items && s.items[0] && s.items[0].link) || "#";
    const seen = new Set();
    const sources = (s.items || []).filter((i) => {
      const name = String(i.source || "").split(" / ").pop();
      if (seen.has(name)) return false;
      seen.add(name); i._name = name; return true;
    }).slice(0, 4);
    return `<article class="card">
      <div class="meta">
        <span class="tag">${tab.emoji} ${esc(tab.label)}</span>
        <span>${ago(s.updated)}</span>
        ${s.trending ? '<span class="hot">🔥 Trending</span>' : ""}
      </div>
      <h2><a href="${esc(first)}" target="_blank" rel="noopener">${esc(s.title)}</a></h2>
      ${s.summary && s.summary !== s.title ? `<p>${esc(s.summary)}</p>` : ""}
      ${s.tip ? `<div class="tip">💡 ${esc(s.tip)}</div>` : ""}
      <div class="sources">${sources.map((i) =>
        `<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i._name)}</a>`).join("")}</div>
    </article>`;
  }

  let stories = [];
  let current = "all";

  function render() {
    const counts = {};
    stories.forEach((s) => { const g = GROUP[s.tab]; if (g) counts[g] = (counts[g] || 0) + 1; });
    counts.all = stories.length;
    const visible = TABS.filter((t) => counts[t.id]);
    if (!visible.some((t) => t.id === current)) current = "all";

    $("tabs").innerHTML = visible.map((t) =>
      `<button class="tab" role="tab" aria-selected="${t.id === current}" data-id="${t.id}">
        ${t.emoji} ${esc(t.label)}<span class="n">${counts[t.id]}</span></button>`).join("");

    const shown = current === "all" ? stories : stories.filter((s) => GROUP[s.tab] === current);
    $("list").innerHTML = shown.length ? shown.map(card).join("")
      : '<div class="empty">Nothing here yet. Check back after the next update ☕</div>';
  }

  $("tabs").addEventListener("click", (e) => {
    const b = e.target.closest(".tab");
    if (!b) return;
    current = b.dataset.id;
    try { localStorage.setItem("tab", current); } catch (_) {}
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  try { current = localStorage.getItem("tab") || "all"; } catch (_) {}

  fetch("data.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((data) => {
      stories = (data.stories || []).filter((s) => GROUP[s.tab]);
      $("date").textContent = data.generated ? niceDate(data.generated) : "";
      $("footer").textContent = data.ai_note && data.ai_note !== "AI on" ? data.ai_note : "";
      render();
    })
    .catch(() => {
      $("date").textContent = "";
      $("list").innerHTML = '<div class="empty">Could not load the news. Try refreshing in a minute.</div>';
    });
</script>
</body>
</html>
